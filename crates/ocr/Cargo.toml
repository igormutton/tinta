[package]
name = "tinta-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tinta-fonts = { workspace = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
# ONNX: the format ocrs publishes its models in (the rten files are no longer served);
# rten: models installed by earlier releases.
rten = { version = "0.26.0", default-features = false, features = ["onnx_format", "rten_format"] }
thiserror.workspace = true
